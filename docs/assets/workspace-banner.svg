<text x="54" y="143" fill="#fff" font-family="system-ui,sans-serif" font-size="50" font-weight="700" letter-spacing="-2">One workspace.</text>
<text x="54" y="201" fill="#fff" font-family="system-ui,sans-serif" font-size="50" font-weight="700" letter-spacing="-2">Real agent workflows.</text>
<text x="56" y="247" fill="#b8b5c4" font-family="system-ui,sans-serif" font-size="18">Chat, tools and a desktop client. Your local harness.</text>
