<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Grok Bot reconstruction: a local workspace for agents</title>
<desc id="desc">Chat, tools and a desktop client connected to an independent local harness. Concept illustration, not a product screenshot.</desc>
